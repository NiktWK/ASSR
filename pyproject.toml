[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "assr"
version = "0.1.0"
description = "Controlled multi-agent ML research workflows"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pydantic>=2.8,<3", "httpx>=0.27,<1", "langgraph>=1,<2", "pyyaml>=6,<7", "psycopg[binary]>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
assr = "assr.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
assr = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
